<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <div class="badge">Teacher Authentication</div>

    <h1>Admin Login</h1>

    <p>Only authorized faculty can generate attendance QR codes.</p>

    <form method="POST">

        <input
            type="password"
            name="password"
            placeholder="Enter Admin Password"
            required
        >

        <br>

        <button type="submit">Login</button>

    </form>

    {% if error %}
        <p style="color:red; margin-top:15px;">
            {{ error }}
        </p>
    {% endif %}

</div>

</body>
</html>
